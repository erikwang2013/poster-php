name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        default: patch
        options: [patch, minor, major]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest version
        id: latest
        run: |
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          echo "version=${TAG:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          IFS='.' read -r M m p <<< "${{ steps.latest.outputs.version }}"
          case "$BUMP" in
            major) M=$((M+1)); m=0; p=0 ;;
            minor) m=$((m+1)); p=0 ;;
            *)     p=$((p+1)) ;;
          esac
          echo "new=${M}.${m}.${p}" >> "$GITHUB_OUTPUT"

      - name: Skip if head already released
        id: check
        run: |
          if git tag --points-at HEAD | grep -qx "v${{ steps.bump.outputs.new }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.skip == 'false'
        run: |
          git tag "v${{ steps.bump.outputs.new }}"
          git push origin "v${{ steps.bump.outputs.new }}"

      - name: Generate changelog
        if: steps.check.outputs.skip == 'false'
        run: |
          PREV=$(git tag -l 'v*' --sort=-v:refname | sed -n 2p)
          if [ -n "$PREV" ]; then
            git log "$PREV..HEAD" --oneline --no-merges | head -50 > changelog.txt
          else
            echo "Initial release" > changelog.txt
          fi

      - name: Create release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.new }}" \
            --title "v${{ steps.bump.outputs.new }}" \
            --notes-file changelog.txt
