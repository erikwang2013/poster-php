<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260" role="img" aria-label="poster-php 项目宠物 Posty">
  <title>poster-php 项目宠物 Posty</title>
  <desc>一只由海报本体与验证码配件组成的吉祥物：左手举二维码卡片，右手举滑块拼图。</desc>

  <!-- 地面投影 -->
  <ellipse cx="150" cy="234" rx="64" ry="10" fill="#E4EBF0"/>
  <!-- 脚 -->
  <ellipse cx="126" cy="210" rx="15" ry="10" fill="#FFFDF8" stroke="#2D3436" stroke-width="3"/>
  <ellipse cx="174" cy="210" rx="15" ry="10" fill="#FFFDF8" stroke="#2D3436" stroke-width="3"/>
  <!-- 触角 -->
  <path d="M150 60V40" stroke="#2D3436" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="150" cy="31" r="8" fill="#FF6B6B" stroke="#2D3436" stroke-width="3"/>

  <!-- 左手道具：二维码卡片 -->
  <g>
    <rect x="4" y="146" width="58" height="58" rx="12" fill="#FFFFFF" stroke="#2D3436" stroke-width="3"/>
    <g fill="#2D3436">
      <rect x="14" y="156" width="14" height="14"/><rect x="38" y="156" width="14" height="14"/>
      <rect x="14" y="180" width="14" height="14"/>
      <rect x="34" y="184" width="5" height="5"/><rect x="43" y="176" width="5" height="5"/>
      <rect x="34" y="194" width="5" height="5"/><rect x="44" y="190" width="10" height="6"/>
      <rect x="48" y="176" width="6" height="6"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="18" y="160" width="6" height="6"/><rect x="42" y="160" width="6" height="6"/>
      <rect x="18" y="184" width="6" height="6"/>
    </g>
  </g>

  <!-- 右手道具：滑块拼图 -->
  <g transform="translate(10,0)">
    <path d="M226 124a8 8 0 0 1 8-8h6a9 9 0 0 0 18 0h4a8 8 0 0 1 8 8v6a9 9 0 0 1 0 18v4a8 8 0 0 1-8 8h-6a9 9 0 0 1-18 0h-4a8 8 0 0 1-8-8v-6a9 9 0 0 0 0-18z"
          fill="#4ECDC4" stroke="#2D3436" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="248" cy="134" r="4" fill="#FFFFFF" opacity="0.75"/>
  </g>

  <!-- 手臂 -->
  <g fill="none" stroke-linecap="round">
    <path d="M94 154Q72 160 66 170" stroke="#2D3436" stroke-width="13"/>
    <path d="M94 154Q72 160 66 170" stroke="#FFFDF8" stroke-width="7"/>
    <path d="M206 154Q228 160 234 170" stroke="#2D3436" stroke-width="13"/>
    <path d="M206 154Q228 160 234 170" stroke="#FFFDF8" stroke-width="7"/>
  </g>

  <!-- 身体（海报本体） -->
  <rect x="84" y="52" width="132" height="152" rx="28" fill="#FFFDF8"/>
  <path d="M112 52H188A28 28 0 0 1 216 80V92H84V80A28 28 0 0 1 112 52Z" fill="#FF6B6B"/>
  <rect x="98" y="64" width="52" height="5" rx="2.5" fill="#FFFFFF" opacity="0.9"/>
  <rect x="98" y="75" width="32" height="5" rx="2.5" fill="#FFFFFF" opacity="0.6"/>
  <rect x="84" y="52" width="132" height="152" rx="28" fill="none" stroke="#2D3436" stroke-width="3.5"/>

  <!-- 表情 -->
  <g>
    <ellipse cx="110" cy="146" rx="11" ry="7" fill="#FFB4B4" opacity="0.75"/>
    <ellipse cx="190" cy="146" rx="11" ry="7" fill="#FFB4B4" opacity="0.75"/>
    <circle cx="126" cy="128" r="10" fill="#2D3436"/>
    <circle cx="174" cy="128" r="10" fill="#2D3436"/>
    <circle cx="130" cy="124" r="3.2" fill="#FFFFFF"/>
    <circle cx="178" cy="124" r="3.2" fill="#FFFFFF"/>
    <path d="M139 150Q150 161 161 150" fill="none" stroke="#2D3436" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- 海报排版占位线 -->
  <rect x="114" y="172" width="72" height="8" rx="4" fill="#FFE3E3"/>
  <rect x="114" y="186" width="48" height="8" rx="4" fill="#E4EBF0"/>

  <!-- 点缀 -->
  <g fill="#FFD166">
    <path d="M0-9 2.6-2.6 9 0 2.6 2.6 0 9-2.6 2.6-9 0-2.6-2.6Z" transform="translate(262,84) scale(0.85)"/>
    <path d="M0-9 2.6-2.6 9 0 2.6 2.6 0 9-2.6 2.6-9 0-2.6-2.6Z" transform="translate(34,120) scale(0.7)"/>
    <path d="M0-9 2.6-2.6 9 0 2.6 2.6 0 9-2.6 2.6-9 0-2.6-2.6Z" transform="translate(238,40) scale(0.5)"/>
  </g>
</svg>
