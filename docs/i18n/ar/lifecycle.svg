<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 812" width="1040" height="812" font-family="'Noto Naskh Arabic','Noto Sans Arabic','Segoe UI',sans-serif" role="img" aria-label="دورة حياة poster-php">
  <title>دورة حياة poster-php</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B2BEC3"/></marker></defs>
  <rect width="1040" height="812" fill="#FFFFFF"/>
  <text x="520" y="42" font-size="23" fill="#2D3436" font-weight="700" text-anchor="middle">دورة حياة poster-php</text>
  <text x="520" y="66" font-size="13" fill="#7F8C8D" text-anchor="middle">رحلة تحقق كاملة وبناء ملصق واحد: من الإنشاء إلى الانتهاء / من التهيئة إلى الإخراج</text>
  <rect x="40" y="118" width="465" height="638" rx="16" fill="#FFF6F6" stroke="#FF6B6B" stroke-width="1.5"/>
  <rect x="60" y="103" width="164.55" height="30" rx="15" fill="#FF6B6B"/>
  <text x="142.28" y="123" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">① دورة حياة التحقق</text>
  <text x="60" y="144" font-size="11.5" fill="#7F8C8D" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">create → generate → store → verify → expire</text>
  <rect x="60" y="160" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="88" cy="189" r="15" fill="#FF6B6B"/>
  <text x="88" y="194" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
  <text x="114" y="185" font-size="14" fill="#2D3436" font-weight="700">الإنشاء</text>
  <text x="114" y="204" font-size="11" fill="#7F8C8D">create(type) — click/rotate/slider/random، صعوبة اختيارية</text>
  <line x1="272.5" y1="222" x2="272.5" y2="232" stroke="#E1E8ED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="236" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="88" cy="265" r="15" fill="#FF6B6B"/>
  <text x="88" y="270" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
  <text x="114" y="261" font-size="14" fill="#2D3436" font-weight="700">التوليد</text>
  <text x="114" y="280" font-size="11" fill="#7F8C8D">generate() — مفتاح وخلفية وأهداف (إحداثيات/زاوية/فراغ)</text>
  <line x1="272.5" y1="298" x2="272.5" y2="308" stroke="#E1E8ED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="312" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="88" cy="341" r="15" fill="#FF6B6B"/>
  <text x="88" y="346" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
  <text x="114" y="337" font-size="14" fill="#2D3436" font-weight="700">التخزين</text>
  <text x="114" y="356" font-size="11" fill="#7F8C8D">set(key, data, ttl) — File/Session/Redis، 300 ث ولمرة واحدة</text>
  <line x1="272.5" y1="374" x2="272.5" y2="384" stroke="#E1E8ED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="388" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="88" cy="417" r="15" fill="#FF6B6B"/>
  <text x="88" y="422" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
  <text x="114" y="413" font-size="14" fill="#2D3436" font-weight="700">الإرسال</text>
  <text x="114" y="432" font-size="11" fill="#7F8C8D">output(&apos;png&apos;) → صورة base64 + تلميحات، دون الإجابة</text>
  <line x1="272.5" y1="450" x2="272.5" y2="460" stroke="#E1E8ED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="464" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="88" cy="493" r="15" fill="#FF6B6B"/>
  <text x="88" y="498" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
  <text x="114" y="489" font-size="14" fill="#2D3436" font-weight="700">التحقق</text>
  <text x="114" y="508" font-size="11" fill="#7F8C8D">verify(key, type, data) — ±18px / ±5° / ±4px</text>
  <line x1="272.5" y1="526" x2="272.5" y2="536" stroke="#E1E8ED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="540" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="88" cy="569" r="15" fill="#FF6B6B"/>
  <text x="88" y="574" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
  <text x="114" y="565" font-size="14" fill="#2D3436" font-weight="700">القرار</text>
  <text x="114" y="584" font-size="11" fill="#7F8C8D">داخل الهامش → نجاح؛ خارجه → فشل؛ لا مفتاح → منتهٍ</text>
  <text x="60" y="630" font-size="12" fill="#2D3436" font-weight="700">النتائج</text>
  <rect x="60" y="642" width="425" height="92" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="80" cy="658" r="4.5" fill="#96CEB4"/>
  <text x="94" y="662" font-size="12.5" fill="#96CEB4" font-weight="700">نجاح</text>
  <text x="133.15" y="662" font-size="10.5" fill="#7F8C8D">del(key) — لا يمكن إعادة استخدام المفتاح</text>
  <circle cx="80" cy="684" r="4.5" fill="#FF8E53"/>
  <text x="94" y="688" font-size="12.5" fill="#FF8E53" font-weight="700">فشل</text>
  <text x="125.86" y="688" font-size="10.5" fill="#7F8C8D">attempts+1 حتى 3 محاولات ثم يُبطَل</text>
  <circle cx="80" cy="710" r="4.5" fill="#7F8C8D"/>
  <text x="94" y="714" font-size="12.5" fill="#7F8C8D" font-weight="700">انتهاء</text>
  <text x="147.73" y="714" font-size="10.5" fill="#7F8C8D">تجاوز المدة أو مفتاح مجهول — أنشئ واحدًا جديدًا</text>
  <rect x="535" y="118" width="465" height="638" rx="16" fill="#F2FBF9" stroke="#4ECDC4" stroke-width="1.5"/>
  <rect x="555" y="103" width="164.55" height="30" rx="15" fill="#4ECDC4"/>
  <text x="637.28" y="123" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">② دورة حياة الملصق</text>
  <text x="555" y="144" font-size="11.5" fill="#7F8C8D" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">new → background → addXxx → render → save</text>
  <rect x="555" y="160" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="583" cy="189" r="15" fill="#4ECDC4"/>
  <text x="583" y="194" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
  <text x="609" y="185" font-size="14" fill="#2D3436" font-weight="700">التهيئة</text>
  <text x="609" y="204" font-size="11" fill="#7F8C8D">new PosterBuilder(driver) أو poster_create(w, h)</text>
  <line x1="767.5" y1="222" x2="767.5" y2="232" stroke="#E1E8ED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="555" y="236" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="583" cy="265" r="15" fill="#4ECDC4"/>
  <text x="583" y="270" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
  <text x="609" y="261" font-size="14" fill="#2D3436" font-weight="700">الخلفية</text>
  <text x="609" y="280" font-size="11" fill="#7F8C8D">background() — لون / صورة (بتحجيم تلقائي) / تدرّج</text>
  <line x1="767.5" y1="298" x2="767.5" y2="308" stroke="#E1E8ED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="555" y="312" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="583" cy="341" r="15" fill="#4ECDC4"/>
  <text x="583" y="346" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
  <text x="609" y="337" font-size="14" fill="#2D3436" font-weight="700">العناصر</text>
  <text x="609" y="356" font-size="11" fill="#7F8C8D">addText / addImage / addQrcode … 14 نوعًا، متسلسلة</text>
  <line x1="767.5" y1="374" x2="767.5" y2="384" stroke="#E1E8ED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="555" y="388" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="583" cy="417" r="15" fill="#4ECDC4"/>
  <text x="583" y="422" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
  <text x="609" y="413" font-size="14" fill="#2D3436" font-weight="700">القالب</text>
  <text x="609" y="432" font-size="11" fill="#7F8C8D">useTemplate($t)-&gt;with($vars) — استبدال {{variable}}</text>
  <line x1="767.5" y1="450" x2="767.5" y2="460" stroke="#E1E8ED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="555" y="464" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="583" cy="493" r="15" fill="#4ECDC4"/>
  <text x="583" y="498" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
  <text x="609" y="489" font-size="14" fill="#2D3436" font-weight="700">الرسم</text>
  <text x="609" y="508" font-size="11" fill="#7F8C8D">المشغلات ترسم على اللوحة؛ الأصل أعلى اليسار والمقاسات تتحجم</text>
  <line x1="767.5" y1="526" x2="767.5" y2="536" stroke="#E1E8ED" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="555" y="540" width="425" height="58" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="583" cy="569" r="15" fill="#4ECDC4"/>
  <text x="583" y="574" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
  <text x="609" y="565" font-size="14" fill="#2D3436" font-weight="700">الإخراج</text>
  <text x="609" y="584" font-size="11" fill="#7F8C8D">save(path, quality) للملف أو output(&apos;png&apos;|&apos;jpg&apos;) كـ data URL</text>
  <text x="555" y="630" font-size="12" fill="#2D3436" font-weight="700">النتائج</text>
  <rect x="555" y="642" width="425" height="92" rx="12" fill="#FFFFFF" stroke="#E1E8ED" stroke-width="1"/>
  <circle cx="575" cy="658" r="4.5" fill="#45B7D1"/>
  <text x="589" y="662" font-size="12.5" fill="#45B7D1" font-weight="700">ملف صورة</text>
  <text x="657.3" y="662" font-size="10.5" fill="#7F8C8D">save() يكتب على القرص لـ CDN أو التخزين</text>
  <circle cx="575" cy="684" r="4.5" fill="#FF6B6B"/>
  <text x="589" y="688" font-size="12.5" fill="#FF6B6B" font-weight="700">رد API</text>
  <text x="642.73" y="688" font-size="10.5" fill="#7F8C8D">output() يعيد base64 جاهزًا للواجهة</text>
  <circle cx="575" cy="710" r="4.5" fill="#4ECDC4"/>
  <text x="589" y="714" font-size="12.5" fill="#4ECDC4" font-weight="700">قالب متكرر</text>
  <text x="671.88" y="714" font-size="10.5" fill="#7F8C8D">نفس القالب بمتغيرات جديدة — إخراج دفعي</text>
</svg>
