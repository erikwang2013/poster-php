.ex-anim-drift { animation: ex-drift 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ex-tremble { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-3.2px,1.76px); } 50% { transform: translate(3.2px,-1.76px); } 75% { transform: translate(-2.56px,1.76px); } }
@keyframes ex-tear { 0% { transform: translateY(0); opacity: 0; } 18% { opacity: 1; } 100% { transform: translateY(11px); opacity: 0; } }
@keyframes ex-heart { 0% { transform: translateY(0) scale(.65); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-18px) scale(1.15); opacity: 0; } }
